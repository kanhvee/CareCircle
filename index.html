<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareCircle</title>
<style>
:root{--bg:#fff8ee;--c:#fff;--t:#1f2937;--m:#4b5563;--acc:#2563eb;--ok:#15803d;--bad:#c81e1e;--b:#f1dcc0;font-size:20px}
body{--acc:#2563eb}body.t-meds{--acc:#15803d}body.t-appts{--acc:#c2570c}body.t-fam{--acc:#7e22ce}body.t-rew{--acc:#be185d}
@media(prefers-color-scheme:dark){:root{--bg:#171a24;--c:#222735;--t:#f3f4f6;--m:#c4cad6;--b:#3a4258}}
body.big{font-size:24px}body.xl{font-size:28px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px 14px 110px}h1{margin:.2em 0;color:var(--acc)}h3{margin:.3em 0}
.card{background:var(--c);border:2px solid var(--b);border-left:8px solid var(--acc);border-radius:18px;padding:14px;margin:12px 0}
button,input,select{font:inherit;border-radius:14px;border:2px solid var(--b);padding:12px 14px;background:var(--c);color:var(--t);min-height:52px}input,select{width:100%;margin:5px 0}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;font-weight:700}button.g{background:transparent;color:var(--acc);border:2px solid var(--acc)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;color:#000;padding:8px;z-index:9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.m{color:var(--m);font-size:.8em}.tag{font-size:.7em;padding:3px 10px;border-radius:99px;background:var(--b);color:var(--t)}
.late{border-left-color:var(--bad)}.done{opacity:.75}.bn{background:linear-gradient(90deg,var(--acc),#f59e0b);color:#fff;border:0;border-left:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:3px solid var(--acc);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:10px 2px;font-size:.75em;display:grid;gap:2px}nav button.on{color:var(--acc);background:var(--b)}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px}.bars div{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:4px}
img.ph{width:64px;height:64px;object-fit:cover;border-radius:12px;cursor:pointer}.garden{font-size:2em;line-height:1.3;word-break:break-all}
#toast{position:fixed;left:12px;right:12px;bottom:96px;background:#111827;color:#fff;border-radius:14px;padding:12px;display:none;z-index:5}
.cf{position:fixed;top:-30px;font-size:28px;animation:fall 2s linear forwards;z-index:9;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style></head><body><a class="skip" href="#app">Skip to content</a><main id="app" tabindex="-1"></main><nav id="nav" aria-label="Main" hidden></nav><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=(d=new Date())=>d.toLocaleDateString('en-CA'),hm=()=>new Date().toTimeString().slice(0,5),mins=x=>+x.slice(0,2)*60+ +x.slice(3);
let S=null,sess=JSON.parse(localStorage.cc_sess||'null'),tab='today',cloud=false,voice=localStorage.cc_voice!=='0',saveT;
document.body.className=localStorage.cc_size||'';
function speak(t){if(!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[^\p{L}\p{N}\s,.:]/gu,' '));u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.dataset.silent)speak(b.getAttribute('aria-label')||b.textContent)});
async function api(b){try{const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.ok?{s:200,...await r.json()}:{s:r.status}}catch(e){return{s:0}}}
function save(){S.updated=Date.now();try{localStorage['cc_p_'+sess.id]=JSON.stringify(S)}catch(e){}if(cloud){clearTimeout(saveT);saveT=setTimeout(()=>api({id:sess.id,pass:sess.pass,action:'put',data:S}),400)}render()}
async function join(f){const id=f.id.toLowerCase().replace(/[^a-z0-9-]/g,'-'),pass=f.pass,me={name:f.name.trim(),role:f.role,email:f.email.trim()};
 if(id.length<3||!pass||!me.name)return alert('Please fill profile id (3+ letters), passcode and your name.');
 let r=await api({id,pass,action:'get'});if(r.s===401)return alert('Wrong passcode.');
 if(r.s===200){S=r.data;cloud=true}else{const loc=localStorage['cc_p_'+id];if(r.s!==404&&loc)S=JSON.parse(loc);
  if(!S)S={name:f.elder||id,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,members:[],meds:[],appts:[],log:{},cheers:[],updated:0};cloud=r.s===404}
 S.cheers=S.cheers||[];sess={id,pass,me};localStorage.cc_sess=JSON.stringify(sess);
 const m=S.members.find(x=>x.name===me.name);if(m)Object.assign(m,me);else S.members.push(me);
 if(cloud&&r.s===404)await api({id,pass,action:'put',data:S});save();if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();speak('Welcome '+me.name)}
function logout(){delete localStorage.cc_sess;sess=null;S=null;render()}
const isElder=()=>sess.me.role==='Elder';
function slots(){const t=day(),n=hm(),o=[];for(const m of S.meds.filter(m=>!m.pending))for(const tm of m.times){const k=`${t}|${m.id}|${tm}`,l=S.log[k];o.push({m,tm,k,l,late:!l&&mins(n)-mins(tm)>60})}return o.sort((a,b)=>a.tm.localeCompare(b.tm))}
function stats(){let pts=0,taken=0,streak=0,perfect=0,go=true;for(const v of Object.values(S.log))if(v.s==='taken'){taken++;pts+=10+(v.ph?5:0)}
 for(let i=0;i<60;i++){const ds=day(new Date(Date.now()-i*864e5));let tot=0,tk=0;for(const m of S.meds.filter(m=>!m.pending&&(m.created||'')<=ds))for(const tm of m.times){tot++;const l=S.log[`${ds}|${m.id}|${tm}`];if(l&&l.s==='taken')tk++}
  if(tot&&tk===tot){perfect++;if(go)streak++}else if(i>0)go=false}
 return{pts,taken,streak,perfect,badges:[['🥇 First Dose',taken>=1],['🌟 10 Doses',taken>=10],['🔥 3-Day Streak',streak>=3],['🏆 7-Day Streak',streak>=7],['💎 30 Doses',taken>=30]]}}
function week(){const r=[];for(let i=6;i>=0;i--){const ds=day(new Date(Date.now()-i*864e5));let t=0,k=0;for(const m of S.meds.filter(m=>!m.pending&&(m.created||'')<=ds))for(const tm of m.times){t++;const l=S.log[`${ds}|${m.id}|${tm}`];if(l&&l.s==='taken')k++}r.push({ds,p:t?Math.round(k/t*100):0})}return r}
function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?' <button data-silent="1" onclick="undoLast()">Undo</button>':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none';last=null},10000)}
let last=null;function undoLast(){if(last){const{k,prev}=last;prev?S.log[k]=prev:delete S.log[k];last=null;$('#toast').style.display='none';save()}}
function mark(k,s,ph){last={k,prev:S.log[k]};S.log[k]={s,by:sess.me.name,at:Date.now(),ph:ph||undefined};
 const withPh=Object.entries(S.log).filter(([,v])=>v.ph).sort((a,b)=>b[1].at-a[1].at);withPh.slice(20).forEach(([kk])=>delete S.log[kk].ph);
 save();if(s==='taken'){confetti();speak('Well done, '+sess.me.name+'! Dose recorded.');toast('Saved. +'+(ph?15:10)+' points!',1)}else toast('Skipped.',1)}
function confetti(){const e=['🎉','🌸','⭐','💛','🌼'];for(let i=0;i<22;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%5];s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const w=Math.min(240,i.width),c=document.createElement('canvas');c.width=w;c.height=i.height*w/i.width;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=fr.result};fr.readAsDataURL(f)})}
function takePhoto(k){const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.onchange=async()=>{if(i.files[0])mark(k,'taken',await shrink(i.files[0]))};i.click()}
function viewPh(k){const w=open('');w.document.write('<img style="max-width:100%" src="'+S.log[k].ph+'">')}
function help(){const to=S.members.filter(m=>m.email&&m.name!==sess.me.name).map(m=>m.email).join(',');location.href=`mailto:${to}?subject=${encodeURIComponent(S.name+' needs help')}&body=${encodeURIComponent('Please check on '+S.name+' now.')}`}
setInterval(()=>{if(!S||!isElder())return;slots().filter(s=>!s.l&&s.tm===hm()&&!window['n'+s.k]).forEach(s=>{window['n'+s.k]=1;speak('Time to take '+s.m.name+', '+s.m.dose+'. Please take a photo.');if('Notification'in window&&Notification.permission==='granted')new Notification('Time for '+s.m.name,{body:s.m.dose})})},20000);
setInterval(async()=>{if(!S||!cloud||document.hidden)return;const r=await api({id:sess.id,pass:sess.pass,action:'get'});if(r.s===200&&r.data.updated>S.updated){S=r.data;render()}},25000);
function login(){return `<h1>💊 CareCircle</h1><p class="m">One shared health profile for the elder, caretakers and family.</p><div class="card"><label>Profile id<input id="id" placeholder="e.g. grandma-sharma"></label><label>Shared passcode<input id="pass" type="password"></label><label>Elder full name (when creating)<input id="elder"></label><label>Your name<input id="name"></label><label>Your role<select id="role"><option>Elder</option><option>Caretaker</option><option>Family</option></select></label><label>Your email (for reminders)<input id="email" type="email"></label>
<button style="width:100%;margin-top:8px" onclick="join({id:id.value,pass:pass.value,elder:elder.value,name:name.value,role:role.value,email:email.value})">🔑 Open or create profile</button></div>`}
function today(){const sl=slots(),pend=S.meds.filter(m=>m.pending),ok=sl.filter(s=>s.l&&s.l.s==='taken').length,nx=sl.find(s=>!s.l&&mins(s.tm)>=mins(hm())),ch=S.cheers[S.cheers.length-1],st=stats();
 return `<div class="row sp"><h1>${isElder()?'Hello, '+esc(sess.me.name):esc(S.name)}</h1><span class="row">${S.emergency?`<a href="tel:${esc(S.emergency)}"><button class="bad" aria-label="Emergency call">🚨 Emergency</button></a>`:''}<button class="bad" onclick="help()" aria-label="Need help, email family">🆘 Help</button></span></div>
 ${nx?`<div class="card bn"><b>⏰ Next dose: ${esc(nx.m.name)} in ${Math.floor((mins(nx.tm)-mins(hm()))/60)}h ${(mins(nx.tm)-mins(hm()))%60}m</b></div>`:''}
 ${ch?`<div class="card">💌 <b>${esc(ch.from)}</b> says: ${esc(ch.msg)} <button class="g" onclick="speak('${esc(ch.from)} says '+${JSON.stringify(ch.msg).replace(/"/g,'&quot;')})" aria-label="Read message aloud">🔊</button></div>`:''}
 ${isElder()&&pend.length?`<div class="card"><h3>Waiting for your OK</h3>${pend.map(m=>`<div class="row sp"><span>${esc(m.name)} ${esc(m.dose)} at ${m.times.join(', ')}<br><span class="m">proposed by ${esc(m.by)}</span></span><span class="row"><button class="ok" onclick="appr('${m.id}',1)">✅ Approve</button><button class="g" onclick="appr('${m.id}',0)">Reject</button></span></div>`).join('')}</div>`:''}
 <p>${ok} of ${sl.length} doses taken today · ⭐ ${st.pts} points · 🔥 ${st.streak}-day streak</p>
 ${sl.map(s=>`<div class="card ${s.late?'late':''} ${s.l?'done':''}"><div class="row sp"><div><b>${s.tm}</b> ${esc(s.m.name)} <span class="m">${esc(s.m.dose)}</span>${s.m.notes?`<div class="m">${esc(s.m.notes)}</div>`:''}</div>
 ${s.l?`<span class="row"><span class="tag">${s.l.s} by ${esc(s.l.by)}</span>${s.l.ph?`<img class="ph" alt="Photo proof of dose" tabindex="0" onclick="viewPh('${s.k}')" src="${s.l.ph}">`:s.l.s==='taken'?'<span class="tag">no photo</span>':''}</span>`
 :`<span class="row"><button onclick="takePhoto('${s.k}')" aria-label="Taken, with photo">📸 Taken + photo</button><button class="ok" onclick="mark('${s.k}','taken')" aria-label="Taken">✔ Taken</button><button class="g" onclick="mark('${s.k}','skipped')" aria-label="Skip">Skip</button><button class="g" onclick="speak('Time to take ${esc(s.m.name)}, ${esc(s.m.dose)}')" aria-label="Read aloud">🔊</button></span>`}</div>${s.late?'<div style="color:var(--bad)"><b>Missed. Family will be told.</b></div>':''}</div>`).join('')||'<p>No medicines yet. Open the Meds tab to add one. 💊</p>'}
 <div class="card"><h3>Last 7 days</h3><div class="bars" role="img" aria-label="Adherence last 7 days">${week().map(d=>`<div title="${d.ds}: ${d.p}%" style="height:${Math.max(d.p,5)}%"></div>`).join('')}</div></div>`}
function appr(id,y){const i=S.meds.findIndex(m=>m.id===id);y?delete S.meds[i].pending:S.meds.splice(i,1);save()}
function meds(){return `<h1>💊 Medicines</h1>${S.meds.map(m=>`<div class="card"><div class="row sp"><div><b>${esc(m.name)}</b> ${esc(m.dose)} ${m.pending?'<span class="tag">waiting for elder OK</span>':''}<div class="m">${m.times.join(', ')} ${esc(m.notes)}</div></div><span class="row"><button class="g" onclick="editMed('${m.id}')">✏️ Edit</button><button class="g" onclick="delMed('${m.id}')">🗑 Remove</button></span></div></div>`).join('')}
 <div class="card"><h3>Add medicine</h3><label>Name<input id="mn"></label><label>Dose (e.g. 500 mg)<input id="md"></label><label>Times, 24h, comma separated (08:00, 20:00)<input id="mt"></label><label>Notes (after food...)<input id="mo"></label><button onclick="addMed()">${isElder()?'➕ Add':'➕ Propose to elder'}</button></div>`}
const parseT=v=>v.split(',').map(x=>x.trim()).filter(x=>/^\d\d:\d\d$/.test(x));
function addMed(){const times=parseT(mt.value);if(!mn.value||!times.length)return alert('Need a name and times like 08:00');S.meds.push({id:uid(),name:mn.value,dose:md.value,times,notes:mo.value,created:day(),by:sess.me.name,pending:!isElder()||undefined});save()}
function editMed(id){const m=S.meds.find(x=>x.id===id),n=prompt('Name',m.name);if(n===null)return;const d=prompt('Dose',m.dose),t=prompt('Times (08:00, 20:00)',m.times.join(', '));if(parseT(t||'').length){m.name=n;m.dose=d||'';m.times=parseT(t)}save()}
function delMed(id){if(confirm('Remove this medicine?')){S.meds=S.meds.filter(m=>m.id!==id);save()}}
function appts(){const a=[...S.appts].sort((x,y)=>x.dt.localeCompare(y.dt));return `<h1>🩺 Doctor visits</h1>${a.map(x=>`<div class="card row sp"><div><b>${esc(x.title)}</b> ${esc(x.doctor)}<div class="m">${x.dt.replace('T',' ')} ${esc(x.notes)}</div></div><span class="row"><button class="g" onclick="speak('${esc(x.title)} on ${x.dt.replace('T',' at ')}')" aria-label="Read aloud">🔊</button><button class="g" onclick="if(confirm('Remove?')){S.appts=S.appts.filter(z=>z.id!=='${x.id}');save()}">🗑</button></span></div>`).join('')}
 <div class="card"><h3>Add visit</h3><label>Title<input id="at"></label><label>Doctor or clinic<input id="ad"></label><label>Date and time<input id="adt" type="datetime-local"></label><label>Notes<input id="an"></label><button onclick="if(!at.value||!adt.value)return alert('Title and date needed');S.appts.push({id:uid(),title:at.value,doctor:ad.value,dt:adt.value,notes:an.value});save()">➕ Add</button></div>`}
function rew(){const st=stats();return `<h1>🏆 Rewards</h1><div class="card"><h3>⭐ ${st.pts} points · 🔥 ${st.streak}-day streak</h3><p class="m">10 points per dose, +5 with a photo. A perfect day grows a flower.</p></div>
 <div class="card"><h3>🌻 My garden</h3><div class="garden" aria-label="${st.perfect} flowers">${'🌸🌼🌻🌷'.repeat(20).match(/./gu).slice(0,st.perfect).join('')||'Take every dose in a day to plant your first flower!'}</div></div>
 <div class="card"><h3>Badges</h3>${st.badges.map(([n,o])=>`<span class="tag" style="opacity:${o?1:.4};margin:3px;display:inline-block">${n}${o?' ✔':''}</span>`).join('')}</div>
 <div class="card"><h3>🎁 Weekly reward</h3><p>${esc(S.reward||'Family can set a reward in the Family tab.')}</p>${st.streak>=7?'<b>🎉 Unlocked! Perfect week!</b>':'<span class="m">Unlocks after a 7-day streak.</span>'}</div>`}
function fam(){return `<h1>👨‍👩‍👧 Care circle</h1>${S.members.map(m=>`<div class="card"><b>${esc(m.name)}</b> <span class="tag">${m.role}</span><div class="m">${esc(m.email||'no email')}</div></div>`).join('')}
 <div class="card"><h3>💌 Send a cheer</h3><label>Message<input id="cm" placeholder="Proud of you, Dadi!"></label><button onclick="if(cm.value){S.cheers.push({from:sess.me.name,msg:cm.value,at:Date.now()});save();toast('Cheer sent!')}">❤️ Send</button></div>
 <div class="card"><h3>Settings</h3><label>Emergency phone<input id="em" type="tel" value="${esc(S.emergency||'')}"></label><label>Weekly reward<input id="rw" value="${esc(S.reward||'')}" placeholder="Video call with grandchildren"></label><button onclick="S.emergency=em.value;S.reward=rw.value;save();toast('Saved')">💾 Save</button>
 <div class="row" style="margin-top:10px"><button class="g" onclick="localStorage.cc_size=document.body.className=({'':'big',big:'xl',xl:''})[document.body.className];">🔠 Text size</button><button class="g" data-silent="1" onclick="voice=!voice;localStorage.cc_voice=voice?1:0;toast('Voice '+(voice?'on':'off'));if(voice)speak('Voice on')">🔊 Voice: ${voice?'on':'off'}</button><button class="g" onclick="logout()">Switch user</button></div>
 <p class="m">Profile id: <b>${esc(sess.id)}</b>. ${cloud?'Cloud sync is on.':'Data stays on this device.'}</p></div>`}
function render(){const nav=$('#nav');if(!S){nav.hidden=true;document.body.classList.remove('t-meds','t-appts','t-fam','t-rew');$('#app').innerHTML=login();return}
 document.body.classList.remove('t-meds','t-appts','t-fam','t-rew');if(tab!=='today')document.body.classList.add('t-'+tab);
 nav.hidden=false;nav.innerHTML=[['today','🏠','Today'],['meds','💊','Meds'],['appts','🩺','Visits'],['rew','🏆','Rewards'],['fam','👨‍👩‍👧','Family']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" aria-label="${l}" ${tab===k?'aria-current="page"':''} onclick="tab='${k}';render()"><span aria-hidden="true">${i}</span>${l}</button>`).join('');
 $('#app').innerHTML={today,meds,appts,rew,fam}[tab]()}
if(sess){const loc=localStorage['cc_p_'+sess.id];join({id:sess.id,pass:sess.pass,name:sess.me.name,role:sess.me.role,email:sess.me.email||''}).then(()=>{if(!S&&loc){S=JSON.parse(loc);S.cheers=S.cheers||[];render()}})}else render();
</script></body></html>
